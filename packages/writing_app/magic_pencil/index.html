<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Magic Pencil · Letterpaths</title>
  <meta name="description" content="Watch a magic pencil write your words." />
</head>
<body>
  <main>
    <div id="stage" aria-hidden="true"></div>
    <p id="idle-status" class="sr-only">awaiting user input</p>
    <form id="form" autocomplete="off">
      <label class="text-cue" for="words">
        <span>Make it write your words</span>
        <svg viewBox="0 0 42 32" aria-hidden="true" focusable="false">
          <path d="M3 8c11-6 28-5 29 5 1 6-4 11-10 14m0-9-1 10 11-1" />
        </svg>
      </label>
      <input id="words" name="words" maxlength="40" placeholder="Enter your text here" enterkeyhint="go" spellcheck="false" aria-describedby="message" />
      <button id="go" type="submit">Go</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <fieldset id="display-modes">
      <legend class="sr-only">Display mode</legend>
      <label><input type="radio" name="display" value="clean" /><span>Clean</span></label>
      <label><input type="radio" name="display" value="vhs" checked /><span>VHS</span></label>
    </fieldset>
    <footer id="home-link">
      <a href="../">Back to letterpaths: free cursive handwriting worksheets and apps</a>
    </footer>
  </main>
  <script type="module" src="../src/magic-pencil/main.ts"></script>
</body>
</html>
